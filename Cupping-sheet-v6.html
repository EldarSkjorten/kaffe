html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.single,html.single body{overflow:hidden;overscroll-behavior:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171d;--ink:#e8ebf2;--sub:#98a1b4;--bar:#1c2028;--barline:#2f3542;--chip:#262b36;--chipb:#3d4455;--chipon:#7ea2f5;--chipontext:#10131a}
}
:root[data-theme="dark"]{--bg:#14171d;--ink:#e8ebf2;--sub:#98a1b4;--bar:#1c2028;--barline:#2f3542;--chip:#262b36;--chipb:#3d4455;--chipon:#7ea2f5;--chipontext:#10131a}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--barline)}
.bar h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.2px}
.ver{font-size:11px;font-weight:400;color:var(--sub);margin-left:8px}
.status{font-size:13px;color:var(--sub);flex:1;min-width:120px}
.seg{display:flex;gap:6px}
.seg button{min-width:48px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--chipb);background:var(--chip);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chipon);border-color:var(--chipon);color:var(--chipontext)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px;padding:18px 16px 32px;max-width:1600px;margin:0 auto}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 14px;padding:16px 12px 28px}}
.grid.single{
  --avail:calc(100vh - var(--bar-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:var(--avail);padding:10px 16px;overflow:hidden;align-content:center;justify-content:center;gap:0;
  grid-template-columns:minmax(0,min(100%,calc((var(--avail) - 76px) / 1.4781)));
}
@supports (height:100dvh){.grid.single{--avail:calc(100dvh - var(--bar-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
.cw{container-type:inline-size;min-width:0}
.cw[hidden]{display:none}
.cap{display:flex;align-items:center;justify-content:flex-end;margin-top:8px;font-size:14px;color:var(--sub)}
.cap button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--chipb);background:var(--chip);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.cap button.arm{border-color:#c0392b;color:#c0392b}

.card{
  --mm:calc(100cqw / 182);
  --pt:calc(.3528 * var(--mm));
  --bw:max(1px, var(--pt));
  position:relative;width:100%;aspect-ratio:182 / 269;background:#fff;color:var(--paperink);color-scheme:light;
  border:var(--bw) solid var(--line);display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--ff);font-weight:500;line-height:normal;
}
.r{border-bottom:var(--bw) solid var(--line)}
.r6{border-bottom:0}
.colA,.colB{display:contents}
.r1{position:relative;flex:.8;padding:calc(4*var(--mm)) calc(5*var(--mm));display:flex;flex-direction:column}
.r2{flex:1;padding:calc(4*var(--mm)) calc(5*var(--mm));display:flex;flex-direction:column}
.r3,.r4{display:grid;grid-template-columns:1fr 1fr}
.r3{flex:.85}.r4{flex:.75}
.c{display:flex;flex-direction:column;min-width:0;min-height:0}
.c.l{padding:calc(4*var(--mm)) calc(6*var(--mm)) calc(4*var(--mm)) calc(5*var(--mm));border-right:var(--bw) solid var(--line)}
.c.rr{padding:calc(4*var(--mm)) calc(5*var(--mm)) calc(4*var(--mm)) calc(6*var(--mm))}
.r4 .c.l{padding:calc(4*var(--mm)) calc(5*var(--mm))}
.r5{display:flex;align-items:center;gap:calc(8*var(--mm));padding:calc(4*var(--mm)) calc(5*var(--mm))}
.r6{flex:1;padding:calc(4*var(--mm)) 0 0;display:flex;flex-direction:column}
.num{position:absolute;top:calc(3.6*var(--mm));right:calc(5*var(--mm));width:calc(9*var(--mm));height:calc(9*var(--mm));pointer-events:none;display:block;overflow:visible}
.num circle{fill:none;stroke:var(--line);stroke-width:6}
.num text{fill:var(--paperink);font-family:var(--ff);font-weight:500;font-size:52px;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;text-anchor:middle}
.h{font-size:calc(11*var(--pt));letter-spacing:.02em;white-space:nowrap}
.s{font-size:calc(9*var(--pt));margin-top:calc(1*var(--mm))}
.two{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:calc(12*var(--mm));margin-top:calc(2.5*var(--mm))}
.sc{display:flex;flex-direction:column}
.sc .t{font-size:calc(9*var(--pt));margin-bottom:calc(2*var(--mm))}
.sl{display:flex;justify-content:space-between;font-size:calc(8.5*var(--pt));margin-top:calc(2*var(--mm))}
.mb3{margin-bottom:calc(3*var(--mm))}
.sb{position:relative;height:calc(3*var(--mm));display:flex;justify-content:space-between;
  background:linear-gradient(var(--line),var(--line)) center / 100% max(1px, calc(.75*var(--pt))) no-repeat}
.sb>i{width:max(1px, calc(.75*var(--pt)));background:var(--line)}
.hit{position:absolute;left:calc(-2*var(--mm));right:calc(-2*var(--mm));top:calc(-6*var(--mm));bottom:calc(-6*var(--mm));touch-action:pan-y;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:44px}
.hit:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.mk{position:absolute;top:50%;width:max(14px, calc(5.2*var(--mm)));height:max(14px, calc(5.2*var(--mm)));border-radius:50%;background:var(--accent);border:max(1.5px, calc(.7*var(--mm))) solid #fff;box-shadow:0 0 0 1px var(--accent);transform:translate(-50%,-50%);display:none;pointer-events:none}
.mk.on{display:block}
.fld{position:relative;flex:1;min-height:0}
.fld::before{content:"";position:absolute;inset:0;border-radius:calc(1.2*var(--mm));background:rgba(36,86,201,.035);border:max(1px, calc(.5*var(--pt))) dotted var(--line);pointer-events:none}
.r1 .fld{margin-top:calc(1.5*var(--mm))}
.r2 .fld{margin-top:calc(3*var(--mm))}
.r3 .fld{margin-top:calc(2.5*var(--mm))}
.r4 .fld{margin-top:calc(2*var(--mm))}
.r6 .fld{margin:calc(2*var(--mm)) calc(3*var(--mm)) calc(3*var(--mm))}
textarea{
  position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;padding:calc(1*var(--mm)) calc(1.4*var(--mm));background:transparent;resize:none;outline:none;
  font-family:var(--ff);font-weight:500;color:#14213d;
  font-size:max(13px, calc(5*var(--mm)));line-height:1.25;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-radius:calc(1.2*var(--mm));-webkit-appearance:none;appearance:none;
}
textarea:focus{background:rgba(36,86,201,.07);box-shadow:inset 0 0 0 1px rgba(36,86,201,.35)}
.cnt{display:none;position:absolute;right:calc(1.5*var(--mm));bottom:calc(1*var(--mm));font-family:var(--ff);font-size:max(10px, calc(3.2*var(--mm)));color:#c0392b;background:rgba(255,255,255,.95);padding:0 calc(1.2*var(--mm));border-radius:3px;pointer-events:none}
.cnt.on{display:block}
.sps{flex:1;display:flex;justify-content:space-evenly;align-items:center;padding:calc(1*var(--mm)) 0}
.sp{position:relative;width:calc(17*var(--mm));aspect-ratio:360 / 181;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sp::after{content:"";position:absolute;inset:calc(-3*var(--mm)) calc(-1*var(--mm))}
.sp i{position:absolute;inset:0;background:var(--paperink);-webkit-mask:var(--spoon) center / contain no-repeat;mask:var(--spoon) center / contain no-repeat}
.rated .sp i{opacity:.2}
.rated .sp.on i{opacity:1;background:var(--accent)}
.sp:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:no-preference){textarea{transition:background .12s}}

.seg .printbtn{margin-left:10px}
@media screen and (orientation:landscape) and (min-width:700px){
  html.single .grid.single{--H:calc(var(--avail) - 76px);grid-template-columns:minmax(0,1fr)}
  html.single .grid.single .card{
    --mm:min(calc(var(--H) / 149), calc(100cqw / 272));
    flex-direction:row;aspect-ratio:auto;width:calc(272 * var(--mm));height:calc(149 * var(--mm));margin:0 auto;
  }
  html.single .grid.single .colA,html.single .grid.single .colB{display:flex;flex-direction:column;flex:1 1 0;min-width:0}
  html.single .grid.single .colB{border-left:var(--bw) solid var(--line)}
  html.single .grid.single .r3{border-bottom:0}
  html.single .grid.single .r4{flex:1}
  html.single .grid.single .r6{flex:1.1}
  html.single .grid.single .sp{width:calc(14*var(--mm))}
  html.single .grid.single .r5{gap:calc(6*var(--mm))}
}
@media print{
  @page{size:A4;margin:12mm 16mm}
  :root{padding:0}
  html,html.single,html.single body,body{overflow:visible!important;height:auto!important;min-height:0!important;background:#fff!important}
  .bar,.cap,.hit,.cnt{display:none!important}
  .grid,.grid.single{display:block;height:auto;padding:0;margin:0;max-width:none;overflow:visible}
  .cw{container-type:normal;width:180mm;height:calc(269 * 177mm / 182);margin:0;break-before:page;page-break-before:always;break-inside:avoid}
  .cw.pfirst{break-before:auto;page-break-before:auto}
  .card{--line:#1a1a1a;--accent:#1a1a1a;--mm:calc(177mm / 182);width:177mm;height:calc(269 * 177mm / 182);aspect-ratio:auto}
  .card,.card *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fld::before{display:none}
  .sp i,.rated .sp.on i{-webkit-mask:none!important;mask:none!important;background:var(--spoon) center / contain no-repeat!important}
  textarea{font-size:2.9mm!important;background:transparent!important;box-shadow:none!important;overflow:hidden;color:#1a1a1a}
}
</style>

  <div class="seg" id="seg" role="group" aria-label="View"></div>
</div>
<main class="grid" id="grid"></main>

<script>
(function(){
  var KEY='cupping-v1';
  var N=4;
  var SCALES=['acid','qual','sweet','body'];
  var blank=function(){return {name:'',aroma:'',flavour:'',notes:'',acidn:'',sweetn:'',bodyn:'',acid:null,qual:null,sweet:null,body:null,rate:0}};
  function norm(o){o.cards=o.cards.map(function(c){return Object.assign(blank(),c)});return o}
  var S={t:0,cards:[blank(),blank(),blank(),blank()]};
  var dirty=false,dbRef=null,timer=null,view=0;

  function valid(o){return o&&Array.isArray(o.cards)&&o.cards.length===N&&typeof o.t==='number'}
  function lsGet(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
  function lsSet(o){try{localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){return false}}
  var loaded=lsGet(); if(valid(loaded)) S=norm(loaded);

  var statusEl=document.getElementById('status');
  function status(t){statusEl.textContent=t}

  var bar=function(k,aria){
    return '<div class="sb"><i></i><i></i><i></i><i></i><i></i><div class="mk" data-mk="'+k+'"></div>'+
      '<div class="hit" data-k="'+k+'" tabindex="0" role="slider" aria-label="'+aria+'" aria-valuemin="0" aria-valuemax="100"></div></div>';
  };
  var lab=function(a,b,c){return '<div class="sl"><span>'+a+'</span><span>'+b+'</span><span>'+c+'</span></div>'};
  var fld=function(f,max,aria){
    return '<div class="fld"><textarea data-f="'+f+'" maxlength="'+max+'" spellcheck="false" autocomplete="off" autocapitalize="sentences" aria-label="'+aria+'"></textarea><div class="cnt">Full</div></div>';
  };

  function cardHTML(i){
    var h='<div class="colA">';
    h+='<div class="r r1"><div class="h">COFFEE NAME &amp; DETAILS</div><div class="s">Origin, varieties, process</div><svg class="num" viewBox="0 0 90 90" role="img" aria-label="Sheet '+(i+1)+'"><circle cx="45" cy="45" r="42"/><text x="45" y="63.7">'+(i+1)+'</text></svg>'+fld('name',200,'Coffee name and details')+'</div>';
    h+='<div class="r r2"><div class="h">ACIDITY</div><div class="two">'+
      '<div class="sc"><div class="t">Intensity</div>'+bar('acid','Acidity, intensity')+lab('LOW','MEDIUM','HIGH')+'</div>'+
      '<div class="sc"><div class="t">Quality</div>'+bar('qual','Acidity, quality')+lab('LOW','MEDIUM','HIGH')+'</div>'+
      '</div>'+fld('acidn',400,'Acidity notes')+'</div>';
    h+='<div class="r r3">'+
      '<div class="c l"><div class="h mb3">SWEETNESS</div>'+bar('sweet','Sweetness')+lab('LOW','MEDIUM','HIGH')+fld('sweetn',300,'Sweetness notes')+'</div>'+
      '<div class="c rr"><div class="h mb3">BODY &amp; TEXTURE</div>'+bar('body','Body and texture')+lab('LIGHT','MEDIUM','HEAVY')+fld('bodyn',300,'Body and texture notes')+'</div>'+
      '</div>';
    h+='</div><div class="colB">';
    h+='<div class="r r4">'+
      '<div class="c l"><div class="h">AROMA</div>'+fld('aroma',400,'Aroma')+'</div>'+
      '<div class="c rr"><div class="h">FLAVOUR</div>'+fld('flavour',400,'Flavour')+'</div>'+
      '</div>';
    h+='<div class="r r5"><div class="h">OVERALL</div><div class="sps">';
    for(var s=1;s<=5;s++)h+='<button class="sp" type="button" data-s="'+s+'" aria-label="Overall '+s+' of 5"><i></i></button>';
    h+='</div></div>';
    h+='<div class="r r6"><div style="padding:0 calc(5*var(--mm))"><div class="h">THOUGHTS AND NOTES</div></div>'+fld('notes',1500,'Thoughts and notes')+'</div>';
    h+='</div>';
    return h;
  }

  var grid=document.getElementById('grid');
  var cws=[];
  for(var i=0;i<N;i++){
    var w=document.createElement('div');w.className='cw';w.dataset.i=i;
    w.innerHTML='<div class="card" data-i="'+i+'">'+cardHTML(i)+'</div>'+
      '<div class="cap"><button type="button" class="clr" data-i="'+i+'" aria-label="Clear sheet '+(i+1)+'">Clear</button></div>';
    grid.appendChild(w);cws.push(w);
  }

  function over(ta){return ta.scrollHeight>ta.clientHeight+1}
  function fit(ta){
    ta.style.fontSize='';
    var base=parseFloat(getComputedStyle(ta).fontSize)||13,sz=base,min=base*0.6;
    while(over(ta)&&sz>min){sz-=0.5;ta.style.fontSize=sz+'px'}
    return over(ta);
  }
  var fullTimers=new WeakMap();
  function flashFull(ta){
    var c=ta.parentNode.querySelector('.cnt');if(!c)return;
    c.classList.add('on');clearTimeout(fullTimers.get(c));
    fullTimers.set(c,setTimeout(function(){c.classList.remove('on')},1500));
  }
  function enforce(ta){
    if(!fit(ta))return;
    var v=ta.value,lo=0,hi=v.length;
    while(lo<hi){
      var mid=(lo+hi+1)>>1;
      ta.value=v.slice(0,mid);
      if(fit(ta))hi=mid-1;else lo=mid;
    }
    ta.value=v.slice(0,lo);fit(ta);flashFull(ta);
  }
  function setMarker(card,k,v){
    var m=card.querySelector('[data-mk="'+k+'"]'),hit=card.querySelector('.hit[data-k="'+k+'"]');
    if(v==null){m.classList.remove('on');hit.removeAttribute('aria-valuenow');return}
    m.style.left=(v*100)+'%';m.classList.add('on');
    hit.setAttribute('aria-valuenow',Math.round(v*100));
  }
  function setRate(card,n){
    card.classList.toggle('rated',n>0);
    card.querySelectorAll('.sp').forEach(function(b){b.classList.toggle('on',+b.dataset.s<=n)});
  }
  function applyCard(i){
    var card=cws[i].querySelector('.card'),d=S.cards[i];
    card.querySelectorAll('textarea').forEach(function(ta){ta.value=d[ta.dataset.f]||'';fit(ta)});
    SCALES.forEach(function(k){setMarker(card,k,d[k])});
    setRate(card,d.rate);
  }
  function applyAll(){for(var i=0;i<N;i++)applyCard(i)}

  function touch(){
    S.t=Date.now();dirty=true;status('Saving…');
    clearTimeout(timer);timer=setTimeout(persist,500);
  }
  function persist(){
    clearTimeout(timer);
    var ok=lsSet(S);
    if(!dbRef){status(ok?'Saved on this device':'Can\u2019t save in this browser');return Promise.resolve()}
    return dbRef.set({json:JSON.stringify(S)}).then(function(){status('Saved and synced')},function(){status(ok?'Saved on this device':'Can\u2019t save in this browser')});
  }

  grid.addEventListener('input',function(e){
    var ta=e.target;if(ta.tagName!=='TEXTAREA')return;
    var i=+ta.closest('.card').dataset.i;
    enforce(ta);
    S.cards[i][ta.dataset.f]=ta.value;touch();
  });

  grid.addEventListener('click',function(e){
    var b=e.target.closest('.sp');
    if(b){
      var card=b.closest('.card'),i=+card.dataset.i,n=+b.dataset.s;
      S.cards[i].rate=(S.cards[i].rate===n)?0:n;
      setRate(card,S.cards[i].rate);touch();return;
    }
    var c=e.target.closest('.clr');
    if(c){
      var j=+c.dataset.i;
      if(c.classList.contains('arm')){
        S.cards[j]=blank();applyCard(j);touch();
        c.classList.remove('arm');c.textContent='Clear';
      }else{
        c.classList.add('arm');c.textContent='Tap again to clear';
        setTimeout(function(){c.classList.remove('arm');c.textContent='Clear'},3500);
      }
    }
  });

  var drag=null;
  function valAt(hit,clientX){
    var r=hit.parentNode.getBoundingClientRect();
    return Math.max(0,Math.min(1,(clientX-r.left)/r.width));
  }
  grid.addEventListener('pointerdown',function(e){
    var hit=e.target.closest('.hit');if(!hit)return;
    var card=hit.closest('.card'),i=+card.dataset.i,k=hit.dataset.k;
    drag={hit:hit,card:card,i:i,k:k,start:S.cards[i][k],x0:e.clientX,moved:false,id:e.pointerId};
    try{hit.setPointerCapture(e.pointerId)}catch(_){}
    var v=valAt(hit,e.clientX);
    S.cards[i][k]=v;setMarker(card,k,v);
  });
  grid.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    if(Math.abs(e.clientX-drag.x0)>4)drag.moved=true;
    var v=valAt(drag.hit,e.clientX);
    S.cards[drag.i][drag.k]=v;setMarker(drag.card,drag.k,v);
  });
  grid.addEventListener('pointerup',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    var cur=S.cards[d.i][d.k];
    if(!d.moved&&d.start!=null&&Math.abs(cur-d.start)<0.05){
      S.cards[d.i][d.k]=null;setMarker(d.card,d.k,null);
    }
    touch();
  });
  grid.addEventListener('pointercancel',function(e){
    if(!drag)return;var d=drag;drag=null;
    S.cards[d.i][d.k]=d.start;setMarker(d.card,d.k,d.start);
  });
  grid.addEventListener('keydown',function(e){
    var hit=e.target.closest&&e.target.closest('.hit');
    if(!hit||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'))return;
    var card=hit.closest('.card'),i=+card.dataset.i,k=hit.dataset.k;
    var cur=S.cards[i][k];cur=cur==null?0.5:cur;
    var v=Math.max(0,Math.min(1,cur+(e.key==='ArrowRight'?0.1:-0.1)));
    S.cards[i][k]=v;setMarker(card,k,v);touch();e.preventDefault();
  });

  var topbar=document.getElementById('topbar');
  function measure(){document.documentElement.style.setProperty('--bar-h',topbar.offsetHeight+'px')}
  var seg=document.getElementById('seg');
  ['All','1','2','3','4'].forEach(function(t,idx){
    var b=document.createElement('button');b.type='button';b.textContent=t;b.dataset.v=idx;
    b.setAttribute('aria-pressed',idx===0?'true':'false');
    b.setAttribute('aria-label',idx===0?'Show all four sheets':'Show sheet '+idx);
    seg.appendChild(b);
  });
  var pb=document.createElement('button');pb.type='button';pb.className='printbtn';pb.textContent='Print';
  pb.setAttribute('aria-label','Print the sheet or sheets shown');seg.appendChild(pb);
  function markFirst(){
    var first=true;
    cws.forEach(function(w){w.classList.remove('pfirst');if(!w.hidden&&first){w.classList.add('pfirst');first=false}});
  }
  window.addEventListener('beforeprint',markFirst);
  function doPrint(){
    markFirst();
    try{window.print()}catch(e){status('Printing isn\u2019t available here. Use Share \u2192 Print in Safari.')}
  }
  function refit(){measure();grid.querySelectorAll('textarea').forEach(fit)}
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('printbtn')){doPrint();return}
    view=+b.dataset.v;
    seg.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',+x.dataset.v===view?'true':'false')});
    document.documentElement.classList.toggle('single',view>0);
    grid.classList.toggle('single',view>0);
    cws.forEach(function(w,i){w.hidden=view>0&&i!==view-1});
    window.scrollTo(0,0);
    measure();requestAnimationFrame(refit);
  });

  var rt;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(refit,120)});
  window.addEventListener('orientationchange',function(){setTimeout(refit,250)});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&dirty)persist()});
  window.addEventListener('pagehide',function(){if(dirty)lsSet(S)});

  measure();
  applyAll();
  status(S.t?'Saved on this device':'Ready');
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);

})();
</script>
</body>
</html>
